<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonshot Stardust Calculator</title>
    <style>
        :root {
            --bg-top: #070b1f;
            --bg-bottom: #0a163a;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: arial, sans-serif;
        }

        body {
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            position: relative;
            animation: fadeIn 3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .stars {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(white 1px, transparent 1px),
                radial-gradient(white 1px, transparent 1px);
            background-size: 100px 100px, 150px 150px;
            background-position: 0 0, 50px 50px;
            animation: moveStars 60s linear infinite, twinkle 6s ease-in-out infinite alternate;
            opacity: 0.6;
        }

        @keyframes moveStars {
            0% { background-position: 0 0, 50px 50px; }
            100% { background-position: -500px -500px, -450px -450px; }
        }

        @keyframes twinkle {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .blobs {
            position: absolute;
            width: 70vmax;
            height: 70vmax;
            background: radial-gradient(circle, rgba(100,180,255,0.1), transparent 60%);
            filter: blur(80px);
            animation: float1 25s ease-in-out infinite;
            top: -20vmax;
            left: -20vmax;
        }

        .blobs.n2 {
            background: radial-gradient(circle, rgba(255,120,200,0.08), transparent 60%);
            bottom: -25vmax;
            right: -25vmax;
            top: auto;
            left: auto;
            animation: float2 30s ease-in-out infinite;
        }

        @keyframes float1 {
            0% { transform: translate(0,0) scale(1); }
            50% { transform: translate(40px,50px) scale(1.1); }
            100% { transform: translate(0,0) scale(1); }
        }

        @keyframes float2 {
            0% { transform: translate(0,0) scale(1); }
            50% { transform: translate(-50px,-40px) scale(1.05); }
            100% { transform: translate(0,0) scale(1); }
        }

        .box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            max-width: 90%;
            padding: 30px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
            color: white;
            text-align: center;
        }

        .box h2 {
            margin-top: 0;
            font-size: 1.8rem;
        }

        .boxnum {
            margin-top: 20px;
            background: white;
            border-radius: 12px;
            padding: 20px;
            color: black;
            font-size: 1rem;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        input {
            width: 80%;
            padding: 10px;
            font-size: 1rem;
            border-radius: 8px;
            border: none;
            text-align: center;
        }

        #result {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #0e0c0c;
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="blobs"></div>
    <div class="blobs n2"></div>

    <div class="box">
        <h2>Stardust Calculator</h2>
        <div class="boxnum">
            <input id="hoursInput" type="number" placeholder="Enter hours" oninput="calculate()">
            <p id="result"></p>
        </div>
        <div class="boxnum">
            <input id="stardustinput" type="number" placeholder="Enter stardust amount" oninput="calculate2()">
            <p id="result2"></p>
        </div>
    </div>

    <script>
        function calculate() {
            const hours = parseFloat(document.getElementById('hoursInput').value);
            const result = hours * 256;
            if (!isNaN(result)) {
                document.getElementById('result').textContent = `✨ Stardust: ${result.toLocaleString()}`;
            } else {
                document.getElementById('result').textContent = '';
            }
        }
        function calculate2() {
            const stars = parseFloat(document.getElementById("stardustinput").value);
            const result2 = stars / 256;
            if (!isNaN(result2)) {
                document.getElementById("result2").textContent = `🕝 housrs: ${result2.toLocaleString()}`;
            } else {
                document.getElementById('result2').textContent = '';
            }
        }
    </script>
</body>
</html>
